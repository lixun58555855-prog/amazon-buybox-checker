name: Amazon CA BuyBox Inspector

on:
  # 支持手动即时检测
  workflow_dispatch:
    inputs:
      asins:
        description: '输入要检测的 ASIN 或亚马逊商品链接 (可填多个)'
        required: false
        default: 'https://www.amazon.ca/dp/B0B53CQYW1'
      postal_code:
        description: '加拿大送货邮编'
        required: false
        default: 'M5V 2T6'

  # 每小时整点自动巡检一次
  schedule:
    - cron: '0 * * * *'

jobs:
  check-buybox:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 检查与加载 Playwright 浏览器缓存
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: 安装 Playwright 与浏览器内核
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: 执行购物车检测与异常微信报警
        env:
          INPUT_ASINS: ${{ github.event.inputs.asins }}
          AMAZON_POSTAL_CODE: ${{ github.event.inputs.postal_code || 'M5V 2T6' }}
          # 绑定微信推送密钥
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python github_runner.py

      - name: 上传检测结果报表 (CSV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-ca-buybox-report
          path: buybox_report.csv
          retention-days: 14
