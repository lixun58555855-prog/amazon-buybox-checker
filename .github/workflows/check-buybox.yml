name: Amazon Multi-Site BuyBox Inspector

on:
  # 手动一键运行：直接点击 Run workflow 即可，无需输入任何内容，全自动读取 asin.txt
  workflow_dispatch:

  # 定时巡检：每小时整点自动执行一次
  schedule:
    - cron: '0 * * * *'

jobs:
  check-buybox:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查与加载 Playwright 浏览器缓存
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: 安装 Playwright 与浏览器内核
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: 执行多站点购物车检测与异常微信报警
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python github_runner.py

      - name: 上传检测结果报表 (CSV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-buybox-report
          path: buybox_report.csv
          retention-days: 14
