name: Amazon Multi-Site BuyBox Inspector

on:
  # 1. 支持手动在网页端输入多站点 ASIN 即时触发
  workflow_dispatch:
    inputs:
      asins:
        description: '输入 ASIN 或链接 (支持美/加/英/德链接，或 US:ASIN, UK:ASIN, DE:ASIN 格式)'
        required: false
        default: 'https://www.amazon.ca/dp/B0B53CQYW1'

  # 2. 定时巡检：每小时整点自动执行一次
  schedule:
    - cron: '0 * * * *'

jobs:
  check-buybox:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查与加载 Playwright 浏览器缓存
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: 安装 Playwright 与浏览器内核
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: 执行多站点购物车检测与异常微信报警
        env:
          INPUT_ASINS: ${{ github.event.inputs.asins }}
          # 微信推送 Token (在 GitHub Secrets 中配置)
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python github_runner.py

      - name: 上传检测结果报表 (CSV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-buybox-report
          path: buybox_report.csv
          retention-days: 14
